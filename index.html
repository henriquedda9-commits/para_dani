<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uma Surpresa para Dani</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-1: #1a0a16;
      --bg-2: #2d0f24;
      --rose: #ff4d79;
      --rose-dark: #c9184a;
      --rose-light: #ff8fa3;
      --gold: #ffd166;
      --gold-dark: #e09f3e;
      --cream: #fff5f7;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #3d1230 0%, var(--bg-2) 45%, var(--bg-1) 100%);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--cream);
      overflow: hidden;
      padding: 24px;
      user-select: none;
    }

    .bg-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255, 220, 232, 0.7);
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.4); }
    }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 520px;
    }

    .hint {
      font-size: 1rem;
      letter-spacing: 0.04em;
      color: #ffd6e0;
      text-align: center;
      opacity: 0.9;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .stage.is-open .hint {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    /* Mensagem surpresa */
    .message-card {
      position: relative;
      z-index: 5;
      width: 100%;
      margin-bottom: 15px;
      background: linear-gradient(145deg, rgba(255, 245, 247, 0.98), rgba(255, 224, 233, 0.96));
      color: #590d22;
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      box-shadow:
        0 20px 60px rgba(255, 77, 121, 0.35),
        0 0 0 2px rgba(255, 209, 102, 0.65),
        inset 0 0 24px rgba(255, 143, 163, 0.25);
      opacity: 0;
      transform: translateY(45px) scale(0.72);
      pointer-events: none;
      transition:
        opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s,
        transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
    }

    .stage.is-open .message-card {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .message-heart {
      display: inline-block;
      font-size: 2.4rem;
      line-height: 1;
      margin-bottom: 12px;
      animation: heartbeat 1.3s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.22); }
      28% { transform: scale(1); }
      42% { transform: scale(1.16); }
      70% { transform: scale(1); }
    }

    .message-subtitle {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.45;
      color: #800f2f;
      margin-bottom: 12px;
    }

    .message-love {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #c9184a, #ff4d79, #d90429);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 14px rgba(255, 77, 121, 0.2);
    }

    /* Caixa de presente */
    .gift-btn {
      position: relative;
      width: 190px;
      height: 175px;
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: transform 0.25s ease;
    }

    .gift-btn:hover:not(.opened) {
      transform: translateY(-4px) scale(1.03);
    }

    .gift-btn:active:not(.opened) {
      transform: scale(0.97);
    }

    .gift-btn:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 10px;
      border-radius: 16px;
    }

    .gift-shadow {
      position: absolute;
      bottom: -12px;
      width: 176px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.55) 0%, transparent 70%);
      transition: transform 0.5s ease;
    }

    .gift-glow {
      position: absolute;
      bottom: 20px;
      width: 150px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 209, 102, 0.45), rgba(255, 77, 121, 0.25), transparent 70%);
      filter: blur(14px);
      animation: pulseGlow 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    .stage.is-open .gift-glow {
      transform: scale(1.45);
      opacity: 0.9;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.95); opacity: 0.65; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    .gift-box {
      position: relative;
      width: 156px;
      height: 112px;
      background: linear-gradient(160deg, var(--rose) 0%, var(--rose-dark) 100%);
      border-radius: 0 0 14px 14px;
      box-shadow:
        inset -12px 0 22px rgba(100, 0, 35, 0.35),
        inset 8px 0 14px rgba(255, 180, 198, 0.25),
        0 14px 28px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    /* Fita vertical da base */
    .gift-box::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 28px;
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    /* Tampa */
    .gift-lid {
      position: absolute;
      bottom: 104px;
      left: 50%;
      width: 174px;
      height: 36px;
      transform: translateX(-50%);
      transform-origin: left bottom;
      background: linear-gradient(160deg, #ff6b91 0%, #d91e53 100%);
      border-radius: 10px;
      box-shadow:
        inset 0 4px 8px rgba(255, 220, 228, 0.35),
        0 8px 18px rgba(0, 0, 0, 0.38);
      transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      z-index: 3;
    }

    .gift-lid::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 30px;
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
      border-radius: 2px;
    }

    /* Laço */
    .gift-bow {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 68px;
      height: 28px;
      z-index: 4;
    }

    .bow-loop {
      position: absolute;
      top: 2px;
      width: 32px;
      height: 24px;
      border: 6px solid var(--gold);
      border-radius: 50% 50% 0 50%;
      background: rgba(255, 209, 102, 0.25);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .bow-loop.left {
      left: 2px;
      transform: rotate(-16deg);
    }

    .bow-loop.right {
      right: 2px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(16deg);
    }

    .bow-knot {
      position: absolute;
      left: 50%;
      bottom: -2px;
      transform: translateX(-50%);
      width: 18px;
      height: 16px;
      border-radius: 6px;
      background: linear-gradient(135deg, #ffe599, var(--gold-dark));
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    /* Animação de tremor convidativo antes de abrir */
    .stage:not(.is-open) .gift-btn {
      animation: gentleWiggle 2.8s ease-in-out infinite;
    }

    @keyframes gentleWiggle {
      0%, 72%, 100% { transform: rotate(0deg); }
      76% { transform: rotate(-3deg) scale(1.02); }
      80% { transform: rotate(3deg) scale(1.03); }
      84% { transform: rotate(-2deg) scale(1.02); }
      88% { transform: rotate(2deg); }
      92% { transform: rotate(0deg); }
    }

    /* Estado aberto */
    .stage.is-open .gift-lid {
      transform: translateX(-92%) translateY(-14px) rotate(-28deg);
    }

    .reset-btn {
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 209, 102, 0.55);
      background: rgba(255, 255, 255, 0.08);
      color: #ffe5ec;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.4s ease 0.55s, transform 0.4s ease 0.55s, background 0.2s ease;
    }

    .stage.is-open .reset-btn {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .reset-btn:hover {
      background: rgba(255, 77, 121, 0.28);
    }

    /* Partículas da explosão */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      font-size: 10px;
      will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div class="bg-stars" id="stars" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <p class="hint" id="hint">✨ Clique na caixa para abrir sua surpresa ✨</p>

    <section class="message-card" id="messageCard" aria-live="polite" aria-hidden="true">
      <div class="message-heart" aria-hidden="true">❤️</div>
      <p class="message-subtitle">O amor da minha vida é tu, Dani</p>
      <p class="message-love">EU TE AMO</p>
    </section>

    <button
      type="button"
      class="gift-btn"
      id="giftBtn"
      aria-expanded="false"
      aria-controls="messageCard"
      aria-label="Abrir caixa de surpresa para Dani"
    >
      <span class="gift-glow" aria-hidden="true"></span>
      <span class="gift-shadow" aria-hidden="true"></span>
      <span class="gift-lid" aria-hidden="true">
        <span class="gift-bow">
          <span class="bow-loop left"></span>
          <span class="bow-loop right"></span>
          <span class="bow-knot"></span>
        </span>
      </span>
      <span class="gift-box" aria-hidden="true"></span>
    </button>

    <button type="button" class="reset-btn" id="resetBtn">
      Fechar e abrir novamente
    </button>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const giftBtn = document.getElementById("giftBtn");
    const resetBtn = document.getElementById("resetBtn");
    const messageCard = document.getElementById("messageCard");
    const starsContainer = document.getElementById("stars");

    // Estrelas de fundo
    for (let i = 0; i < 42; i++) {
      const star = document.createElement("span");
      star.className = "star";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.setProperty("--dur", (2 + Math.random() * 3.5).toFixed(2) + "s");
      star.style.setProperty("--delay", (Math.random() * 3).toFixed(2) + "s");
      starsContainer.appendChild(star);
    }

    function playGentleChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.5]; // Dó5, Mi5, Sol5, Dó6
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = ctx.currentTime + idx * 0.09;
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.exponentialRampToValueAtTime(0.11, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.65);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.7);
        });
      } catch (_) {
        // Ignora caso áudio esteja bloqueado
      }
    }

    function burstParticles() {
      const rect = giftBtn.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height * 0.35;
      const symbols = ["❤️", "💖", "💕", "✨", "💛", "🌸"];

      for (let i = 0; i < 32; i++) {
        const el = document.createElement("span");
        el.className = "particle";
        el.textContent = symbols[i % symbols.length];
        el.style.left = originX + "px";
        el.style.top = originY + "px";
        el.style.fontSize = 16 + Math.random() * 18 + "px";
        document.body.appendChild(el);

        const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.35;
        const speed = 110 + Math.random() * 210;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        const rot = (Math.random() - 0.5) * 320;
        const duration = 1100 + Math.random() * 650;

        el.animate(
          [
            { transform: "translate(-50%, -50%) scale(0.3) rotate(0deg)", opacity: 1 },
            {
              transform: `translate(calc(-50% + ${vx}px), calc(-50% + ${vy + 120}px)) scale(1.1) rotate(${rot}deg)`,
              opacity: 0
            }
          ],
          { duration, easing: "cubic-bezier(0.16, 1, 0.3, 1)", fill: "forwards" }
        ).onfinish = () => el.remove();
      }
    }

    function openBox() {
      if (stage.classList.contains("is-open")) return;
      stage.classList.add("is-open");
      giftBtn.classList.add("opened");
      giftBtn.setAttribute("aria-expanded", "true");
      messageCard.setAttribute("aria-hidden", "false");
      playGentleChime();
      burstParticles();
    }

    function closeBox() {
      stage.classList.remove("is-open");
      giftBtn.classList.remove("opened");
      giftBtn.setAttribute("aria-expanded", "false");
      messageCard.setAttribute("aria-hidden", "true");
    }

    giftBtn.addEventListener("click", openBox);
    resetBtn.addEventListener("click", closeBox);
  </script>
</body>


</html>
